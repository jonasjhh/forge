modules:
  jira:globalPage:
    - key: compass
      resource: main
      resolver:
        function: resolver
      title: Compass
      layout: blank

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/application/build

permissions:
  scopes:
    - storage:app
    - read:jira-user
  external:
    images:
      - address: https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net
      - address: https://avatar-management--avatars.us-east-1.prod.public.atl-paas.net
      - address: https://avatar-management--avatars.eu-central-1.prod.public.atl-paas.net
      - address: https://avatar-cdn.atlassian.com
      - address: '*.atlassian.net'

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/66a32446-0d08-42e2-a954-b7da65b8c997
